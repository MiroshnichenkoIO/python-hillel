{% extends "base.html" %}
{% block title %}
    Оплата
{% endblock %}
{% block content %}
    <h2>{{ order }}</h2>

    {% for item in order.items.all %}
        <p>{{ item.book.title }} - {{ item.quantity }} шт. - {{ item.get_cost }} грн</p>
    {% endfor %}
    <p>Разом: {{ order.get_total_cost }} грн</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Оплатити через Stripe</button>
    </form>
{% endblock %}
