{% extends "base.html" %}

{% block content %}
<h1>{% if object %}Змінити книгу{% else %}Нова книга{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success" type="submit">Зберегти</button>
    <a class="btn btn-secondary" href="{% url 'shop:book_list' %}">Скасувати</a>
</form>
{% endblock %}
