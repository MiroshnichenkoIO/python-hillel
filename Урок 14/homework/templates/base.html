{% load static %}
<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Книжковий магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'shop:book_list' %}">Книжковий магазин</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="{% url 'shop:book_list' %}">Книги</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'shop:book_create' %}">Додати</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'admin:index' %}">Адмінка</a>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
